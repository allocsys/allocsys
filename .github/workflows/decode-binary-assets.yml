name: Decode Binary Assets

# Binary files (PDFs, etc.) can't be pushed reliably through our text-only
# MCP tooling -- arbitrary bytes get mangled over the UTF-8 JSON transport.
# Workaround: commit the base64-encoded text instead (safe, diffable), and
# let this workflow decode it into the real binary using git directly on
# the runner, where there's no such transport constraint.
#
# Usage: commit/update e.g. `resume.pdf.b64`, push to main. This workflow
# decodes it to `resume.pdf` and commits the result automatically.

on:
  push:
    branches: [main]
    paths:
      - '**/*.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode all *.b64 files to their real binary
        run: |
          set -e
          shopt -s globstar nullglob
          changed=0
          for f in **/*.b64; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            echo "Decoded $f -> $out"
            changed=1
          done
          if [ "$changed" = "0" ]; then
            echo "No .b64 files found"
          fi

      - name: Commit decoded output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.pdf' '*.png' '*.jpg' '*.jpeg' '*.zip'
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: decode binary asset(s) from base64 source"
            git push
          fi
